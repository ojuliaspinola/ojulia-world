# Static site. Nothing is built — the repo root is what gets published.

[build]
  publish = "."
  command = ""

# Fingerprint-free assets, but they only change when Julia replaces the file,
# and the filename changes when she does. Cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# HTML always comes fresh, so an edit is live the moment it deploys.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/portfolio/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/contact/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/garden/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The garden IS this file. It must never be cached, or Julia's edit is live
# on GitHub and invisible on the site.
[[headers]]
  for = "/garden/notes.md"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/markdown; charset=utf-8"


# LAUNCH SWITCH - keeps the whole site out of search results
# TO GO LIVE: delete this block and set robots.txt back to Allow: /
[[headers]]
for = "/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
