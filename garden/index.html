<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Garden &#8212; Julia Spinola</title>
<meta name="description" content="A digital garden. Notes, beliefs, sources and scraps, linked to each other and never sorted by date. Grown from one markdown file.">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/garden.css">
<script>
document.documentElement.className += " js";
setTimeout(function () {
  var d = document.documentElement, b = document.querySelector(".boot");
  if (d.className.indexOf("grown") > -1 || document.querySelector(".trouble") || !b) return;
  b.innerHTML = "<a href=\"/garden/notes.md\">Read notes.md</a>";
  b.className = "boot late";
}, 9000);
</script>
</head>
<body>

<main class="poster" id="top">
  <div class="ground b"></div>
  <div class="ground"></div>
  <div class="riso" aria-hidden="true"></div>
  <div class="dots" aria-hidden="true"></div>

  <!-- THE ROOTS. drawn with the same marker filter as everything else -->
  <div class="roots" aria-hidden="true">
    <svg viewBox="0 0 250 1200" preserveAspectRatio="none" filter="url(#marker)">
      <g fill="none" stroke="#6C9E52" stroke-linecap="round">
        <path d="M96 -20 C96 120 44 190 52 300 C60 420 118 470 110 600 C104 720 40 780 52 900 C62 1010 96 1080 90 1220" stroke-width="6"/>
        <path d="M52 300 C10 330 -8 372 -14 420" stroke-width="4"/>
        <path d="M110 600 C160 630 182 676 186 730" stroke-width="4"/>
        <path d="M52 900 C6 928 -6 964 -10 1010" stroke-width="3.5"/>
        <path d="M78 160 C120 190 138 232 140 280" stroke-width="3"/>
        <path d="M96 1080 C142 1104 160 1140 164 1186" stroke-width="3"/>
      </g>
      <g fill="#2B4EA2" opacity=".5">
        <circle cx="-14" cy="420" r="7"/><circle cx="186" cy="730" r="6"/>
        <circle cx="140" cy="280" r="5"/><circle cx="-10" cy="1010" r="6"/>
      </g>
    </svg>
  </div>

  <div class="wrap">

    <header class="top">
      <a class="back" href="/"><i>&#8592;</i> Hello World</a>
    </header>

    <h1 class="title" data-t="Digital Garden">Digital Garden</h1>

    <noscript>
      <p class="js-off"><a class="pill" href="/garden/notes.md">Read notes.md &#8594;</a></p>
    </noscript>

    <!-- ── THE BAR ──────────────────────────────────────────────────────── -->
    <div class="bar" id="sortbar">
      <p class="seek">
        <label for="q">Find</label>
        <input id="q" type="search" autocomplete="off" autocorrect="off" spellcheck="false"
               placeholder="type anywhere to narrow">
        <button type="button" id="clear" hidden>Clear</button>
      </p>
      <p id="readout" aria-live="polite" role="status">&#8212;</p>

      <div class="rows">

        <div class="row" id="paths" hidden>
          <h2 class="rl">Paths</h2>
          <span id="path-host" style="display:contents"></span>
          </div>

        <div class="row" id="shelves">
          <h2 class="rl">Shelves</h2>
          <span id="shelf-host" style="display:contents"></span>
        </div>
      </div>
    </div>

    <!-- ── THE BED ──────────────────────────────────────────────────────── -->
    <section class="bed" aria-labelledby="h-bed">
      <h2 class="sec-h" id="h-bed">The bed <i>(<span id="count">&#8212;</span> notes &#183; <span id="link-n">&#8212;</span> links)</i></h2>

      <div id="bed-host">
        <p class="boot">Reading garden/notes.md&#8230;</p>
      </div>

      <div id="nothing" hidden>
        <b>Nothing matches that</b>
      </div>
    </section>

    <!-- ── THE UNWRITTEN ────────────────────────────────────────────────── -->
    <section class="unwritten" id="unwritten" aria-labelledby="h-un" hidden>
      <h2 class="sec-h" id="h-un">Unwritten <i>(<span id="ghost-n">0</span>)</i></h2>
      <ul class="gh-l" id="ghost-list"></ul>
    </section>

    <footer class="foot">
      <a class="back" href="/"><i>&#8592;</i> Back to Hello World</a>
      <a class="back fwd" href="/portfolio/">Portfolio <i>&#8594;</i></a>
      <a class="back fwd" href="/contact/">Contact <i>&#8594;</i></a>
    </footer>

  </div>

  <div class="grit" aria-hidden="true"></div>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="marker" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="3" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<script src="/js/garden.js"></script>
</body>
</html>
