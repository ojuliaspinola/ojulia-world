<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact &#8212; Julia Spinola</title>
<meta name="description" content="Contact. Every channel is a station, ordered by how likely a reply actually is.">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/contact.css">
</head>
<body>

<main class="poster" id="top">
  <div class="ground b"></div>
  <div class="ground"></div>
  <div class="riso" aria-hidden="true"></div>
  <div class="dots" aria-hidden="true"></div>

  <div class="wrap">

    <header class="top">
      <a class="back" href="/"><i>&#8592;</i> Hello World</a>
    </header>

    <div class="masthead">
      <div class="mh-t">
        <h1 class="title" data-t="Contact">Contact</h1>
      </div>

      <!-- ── THE RECEIVER. the same planet as on Hello World, closer up ───── -->
      <div class="aerial" aria-hidden="true">
        <svg class="arcs" viewBox="0 0 400 400" filter="url(#marker)">
          <g fill="none" stroke-linecap="round">
            <circle cx="200" cy="200" r="128" stroke="#59C6C3" stroke-width="5" stroke-dasharray="4 16" opacity=".8"/>
            <circle cx="200" cy="200" r="158" stroke="#2B4EA2" stroke-width="4" stroke-dasharray="3 21" opacity=".55"/>
            <circle cx="200" cy="200" r="192" stroke="#59C6C3" stroke-width="6" stroke-dasharray="2 26" opacity=".45"/>
            <circle cx="200" cy="200" r="236" stroke="#8E7BC4" stroke-width="5" stroke-dasharray="2 30" opacity=".45"/>
          </g>
        </svg>
        <span class="globe"><img src="/assets/img/contactsandsocials.png" alt=""></span>
      </div>
    </div>

    <!-- ── THE STATIONS. four, no commentary ────────────────────── -->
    <section class="board" aria-labelledby="h-stations">
      <h2 class="sec-h" id="h-stations">Stations</h2>

      <ol class="stations">

        <li class="st">
          <i class="idx">01</i>
          <button class="stn copy" type="button" data-copy="ojuliaspinola@gmail.com">
            <svg class="ico" viewBox="0 0 8 8" aria-hidden="true"><use href="#i-mail"></use></svg>
            <span class="head"><span class="nm">Email</span></span>
            <span class="dest">ojuliaspinola@gmail.com<i class="said" aria-hidden="true">copied</i></span>
          </button>
        </li>

        <li class="st">
          <i class="idx">02</i>
          <a class="stn" href="https://www.instagram.com/ojuliaspinola">
            <svg class="ico" viewBox="0 0 8 8" aria-hidden="true"><use href="#i-cam"></use></svg>
            <span class="head"><span class="nm">Instagram</span></span>
            <span class="dest">instagram.com/ojuliaspinola<i class="arw">&#8599;</i></span>
          </a>
        </li>

        <li class="st">
          <i class="idx">03</i>
          <button class="stn copy" type="button" data-copy="beyondtomorrowstudios@gmail.com">
            <svg class="ico" viewBox="0 0 8 8" aria-hidden="true"><use href="#i-mail"></use></svg>
            <span class="head"><span class="nm">Beyond Tomorrow Studios</span></span>
            <span class="dest">beyondtomorrowstudios@gmail.com<i class="said" aria-hidden="true">copied</i></span>
          </button>
        </li>

        <li class="st">
          <i class="idx">04</i>
          <a class="stn" href="https://www.linkedin.com/in/ojuliaspinola/">
            <svg class="ico" viewBox="0 0 8 8" aria-hidden="true"><use href="#i-badge"></use></svg>
            <span class="head"><span class="nm">LinkedIn</span></span>
            <span class="dest">linkedin.com/in/ojuliaspinola<i class="arw">&#8599;</i></span>
          </a>
        </li>

      </ol>
    </section>

    <footer class="foot">
      <a class="back" href="/"><i>&#8592;</i> Back to Hello World</a>
      <a class="back fwd" href="/portfolio/">Portfolio <i>&#8594;</i></a>
    </footer>

  </div>

  <div class="grit" aria-hidden="true"></div>
</main>

<script src="/js/contact.js"></script>

<!-- pixel icons, drawn on the same 8&#215;8 grid as the type -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="marker" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="3" seed="11" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <g id="i-mail"><path fill="currentColor" shape-rendering="crispEdges" d="M0 1h8v1H0zM0 2h1v4H0zM7 2h1v4H7zM0 6h8v1H0zM1 2h1v1H1zM2 3h1v1H2zM3 4h2v1H3zM5 3h1v1H5zM6 2h1v1H6z"/></g>
    <g id="i-cam"><path fill="currentColor" shape-rendering="crispEdges" d="M0 0h8v1H0zM0 1h1v6H0zM7 1h1v6H7zM0 7h8v1H0zM3 2h2v1H3zM2 3h1v2H2zM5 3h1v2H5zM3 5h2v1H3zM5 1h1v1H5z"/></g>
    <g id="i-badge"><path fill="currentColor" shape-rendering="crispEdges" d="M0 0h8v1H0zM0 1h1v6H0zM7 1h1v6H7zM0 7h8v1H0zM2 2h1v1H2zM2 4h1v2H2zM4 4h1v2H4zM6 4h1v2H6zM4 3h2v1H4z"/></g>
  </defs>
</svg>

</body>
</html>
